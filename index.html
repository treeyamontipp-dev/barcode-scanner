<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no">

  <title>สแกนบาร์โค้ดสินค้า</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 22px 16px 35px;
    }

    .page {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 8px;
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      line-height: 1.5;
      color: #ddd;
      margin-bottom: 20px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      min-height: 420px;
      background: #111;
      border-radius: 22px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 65vh;
      max-height: 650px;
      min-height: 420px;
      display: block;
      object-fit: cover;
      background: #111;
    }

    .scan-frame {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 180px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 45px;
      height: 45px;
      border-color: #fff;
      border-style: solid;
    }

    .tl {
      left: 0;
      top: 0;
      border-width: 6px 0 0 6px;
    }

    .tr {
      right: 0;
      top: 0;
      border-width: 6px 6px 0 0;
    }

    .bl {
      left: 0;
      bottom: 0;
      border-width: 0 0 6px 6px;
    }

    .br {
      right: 0;
      bottom: 0;
      border-width: 0 6px 6px 0;
    }

    .scan-line {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 50%;
      height: 3px;
      background: #fff;
      opacity: .8;
    }

    #status {
      margin-top: 15px;
      padding: 15px;
      background: #171717;
      border-radius: 14px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }

    #result {
      display: none;
      margin-top: 15px;
      padding: 18px;
      border-radius: 14px;
      background: #12351e;
      text-align: center;
    }

    #barcodeText {
      margin-top: 8px;
      font-size: 28px;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      width: 100%;
      min-height: 58px;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #fff;
      color: #111;
    }

    #switchBtn {
      display: none;
      background: #333;
      color: #fff;
    }

    #backBtn {
      background: #292929;
      color: #fff;
    }

    .small {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="page">

  <h1>สแกนบาร์โค้ดสินค้า</h1>

  <div class="subtitle">
    หันกล้องไปที่บาร์โค้ด<br>
    ระบบจะอ่านให้อัตโนมัติ
  </div>

  <div class="camera-box">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div class="scan-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line"></div>
    </div>

  </div>

  <div id="status">
    กดปุ่ม “เปิดกล้อง”
  </div>

  <div id="result">
    ✅ อ่าน Barcode สำเร็จ
    <div id="barcodeText"></div>
  </div>

  <button id="startBtn" onclick="startCamera()">
    📷 เปิดกล้อง
  </button>

  <button id="switchBtn" onclick="switchCamera()">
    🔄 สลับกล้อง
  </button>

  <button id="backBtn" onclick="goBack()">
    ← กลับ
  </button>

  <div class="small" id="debug"></div>

</div>


<script>

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const barcodeText = document.getElementById("barcodeText");
const startBtn = document.getElementById("startBtn");
const switchBtn = document.getElementById("switchBtn");
const debugBox = document.getElementById("debug");

let stream = null;
let cameras = [];
let currentCameraIndex = 0;

let detector = null;
let scanning = false;
let detected = false;


/* ========================================
   เปิดกล้อง
======================================== */

async function startCamera() {

  detected = false;
  resultBox.style.display = "none";

  statusBox.innerHTML =
    "⏳ กำลังขอสิทธิ์เปิดกล้อง...";

  startBtn.disabled = true;

  stopCamera();


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      "Browser นี้ไม่รองรับการเปิดกล้องผ่านเว็บไซต์"
    );

    return;
  }


  try {

    /*
      ขั้นที่ 1
      ขอ Video แบบไม่บังคับกล้องก่อน

      จุดนี้ตั้งใจไม่ใช้
      facingMode exact
      และไม่ใช้ deviceId
    */

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: true
      });


    video.srcObject = stream;

    await video.play();


    statusBox.innerHTML =
      "✅ เปิดกล้องสำเร็จ";


    /*
      เมื่อได้ Permission แล้ว
      ค่อยดูว่ามีกล้องอะไรบ้าง
    */

    await loadCameras();


    /*
      ถ้ามีกล้องมากกว่า 1 ตัว
      พยายามหากล้องหลัง
    */

    if (cameras.length > 1) {

      switchBtn.style.display = "block";

      const backIndex =
        findBackCameraIndex();


      if (backIndex !== -1) {

        await openSpecificCamera(backIndex);

      }

    }


    await prepareBarcodeDetector();


  } catch (error) {

    console.error(error);

    showError(
      error.name +
      ": " +
      error.message
    );

  }

}


/* ========================================
   โหลดรายการกล้อง
======================================== */

async function loadCameras() {

  try {

    const devices =
      await navigator.mediaDevices.enumerateDevices();


    cameras =
      devices.filter(function(device) {

        return device.kind === "videoinput";

      });


    debugBox.innerHTML =
      "พบกล้อง " +
      cameras.length +
      " ตัว";


  } catch (error) {

    console.log(error);

  }

}


/* ========================================
   หากล้องหลัง
======================================== */

function findBackCameraIndex() {

  for (
    let i = 0;
    i < cameras.length;
    i++
  ) {

    const name =
      (cameras[i].label || "")
      .toLowerCase();


    if (
      name.includes("back") ||
      name.includes("rear") ||
      name.includes("environment") ||
      name.includes("หลัง")
    ) {

      return i;

    }

  }


  /*
    มือถือหลายรุ่นเรียงกล้องหน้าเป็นตัวแรก
    ถ้าหาชื่อไม่ได้ ลองตัวสุดท้าย
  */

  if (cameras.length > 1) {

    return cameras.length - 1;

  }


  return -1;

}


/* ========================================
   เปิดกล้องตาม Device ID
======================================== */

async function openSpecificCamera(index) {

  if (
    !cameras[index] ||
    !cameras[index].deviceId
  ) {

    return;

  }


  stopCamera();


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          deviceId: {
            exact: cameras[index].deviceId
          }

        }

      });


    currentCameraIndex = index;

    video.srcObject = stream;

    await video.play();


    statusBox.innerHTML =
      "🔎 นำ Barcode ให้อยู่ในกรอบ";


  } catch (error) {

    console.log(
      "เปิดกล้องที่เลือกไม่ได้",
      error
    );


    /*
      ถ้าเลือกกล้องหลังไม่ได้
      กลับมาใช้กล้องทั่วไป
    */

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: true
      });


    video.srcObject = stream;

    await video.play();

  }

}


/* ========================================
   สลับกล้อง
======================================== */

async function switchCamera() {

  if (cameras.length < 2) {
    return;
  }


  currentCameraIndex++;

  if (
    currentCameraIndex >=
    cameras.length
  ) {

    currentCameraIndex = 0;

  }


  await openSpecificCamera(
    currentCameraIndex
  );

}


/* ========================================
   เตรียมตัวอ่าน Barcode
======================================== */

async function prepareBarcodeDetector() {

  if (!("BarcodeDetector" in window)) {

    statusBox.innerHTML =
      "⚠️ เปิดกล้องได้แล้ว แต่ Browser นี้ไม่มี BarcodeDetector";


    debugBox.innerHTML +=
      "<br>ลองเปิดด้วย Chrome บน Android";

    startBtn.disabled = false;

    return;

  }


  try {

    const supported =
      await BarcodeDetector.getSupportedFormats();


    const wanted = [
      "ean_13",
      "ean_8",
      "upc_a",
      "upc_e",
      "code_128",
      "code_39",
      "codabar",
      "itf"
    ];


    const formats =
      wanted.filter(function(format) {

        return supported.includes(format);

      });


    if (formats.length > 0) {

      detector =
        new BarcodeDetector({
          formats: formats
        });

    }

    else {

      detector =
        new BarcodeDetector();

    }


    scanning = true;

    statusBox.innerHTML =
      "🔎 นำ Barcode ให้อยู่ในกรอบ";


    scanLoop();


  } catch (error) {

    console.error(error);

    detector =
      new BarcodeDetector();

    scanning = true;

    scanLoop();

  }

}


/* ========================================
   อ่าน Barcode ต่อเนื่อง
======================================== */

async function scanLoop() {

  if (
    !scanning ||
    detected
  ) {

    return;

  }


  if (
    video.readyState >= 2 &&
    detector
  ) {

    try {

      const barcodes =
        await detector.detect(video);


      if (
        barcodes &&
        barcodes.length > 0
      ) {

        const value =
          String(
            barcodes[0].rawValue || ""
          ).trim();


        if (value) {

          barcodeFound(value);

          return;

        }

      }

    } catch (error) {

      /*
        ระหว่างกล้องกำลังโหลด
        detect อาจ error ชั่วคราว
        ให้สแกนต่อ
      */

    }

  }


  setTimeout(
    scanLoop,
    120
  );

}


/* ========================================
   พบ Barcode
======================================== */

function barcodeFound(value) {

  if (detected) {
    return;
  }


  detected = true;
  scanning = false;


  barcodeText.textContent =
    value;


  resultBox.style.display =
    "block";


  statusBox.innerHTML =
    "✅ สแกนสำเร็จ";


  if (navigator.vibrate) {

    navigator.vibrate(
      [100, 60, 100]
    );

  }


  stopCamera();


  /*
    ถ้ามาจากระบบหลัก
    ส่ง Barcode กลับ
  */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    params.get("return");


  if (returnUrl) {

    setTimeout(
      function() {

        const separator =
          returnUrl.includes("?")
          ? "&"
          : "?";


        window.location.href =
          returnUrl +
          separator +
          "barcode=" +
          encodeURIComponent(value);

      },
      600
    );

  }

}


/* ========================================
   ปิดกล้อง
======================================== */

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

  }


  stream = null;

  video.srcObject = null;

}


/* ========================================
   แสดง Error
======================================== */

function showError(message) {

  startBtn.disabled = false;

  startBtn.style.display = "block";


  statusBox.innerHTML =
    "❌ เปิดกล้องไม่สำเร็จ<br><br>" +
    escapeHtml(message);


  debugBox.innerHTML =
    "HTTPS: " +
    (
      window.isSecureContext
      ? "ใช่"
      : "ไม่ใช่"
    );

}


/* ========================================
   ปุ่มกลับ
======================================== */

function goBack() {

  stopCamera();


  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    params.get("return");


  if (returnUrl) {

    window.location.href =
      returnUrl;

  }

  else {

    history.back();

  }

}


/* ========================================
   ป้องกัน HTML
======================================== */

function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ========================================
   ออกจากหน้า ปิดกล้อง
======================================== */

window.addEventListener(
  "pagehide",
  stopCamera
);

</script>

</body>
</html>
