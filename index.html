<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
  maximum-scale=1.0, user-scalable=no">

<title>สแกนบาร์โค้ดสินค้า</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, "Noto Sans Thai", sans-serif;
}

body {
  min-height: 100vh;
  padding: 18px 16px 30px;
}

.page {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin: 8px 0 5px;
}

.subtitle {
  text-align: center;
  color: #ddd;
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 16px;
}

.camera-box {
  position: relative;
  width: 100%;
  height: 58vh;
  min-height: 390px;
  max-height: 620px;
  background: #111;
  border-radius: 22px;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #111;
}

.scan-frame {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 50%;
  height: 180px;
  transform: translateY(-50%);
  pointer-events: none;
}

.corner {
  position: absolute;
  width: 45px;
  height: 45px;
  border-color: #fff;
  border-style: solid;
}

.tl {
  left: 0;
  top: 0;
  border-width: 6px 0 0 6px;
}

.tr {
  right: 0;
  top: 0;
  border-width: 6px 6px 0 0;
}

.bl {
  left: 0;
  bottom: 0;
  border-width: 0 0 6px 6px;
}

.br {
  right: 0;
  bottom: 0;
  border-width: 0 6px 6px 0;
}

.scan-line {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  height: 3px;
  background: #fff;
  opacity: .75;
}

#status {
  margin-top: 14px;
  padding: 16px;
  border-radius: 14px;
  background: #151515;
  text-align: center;
  font-size: 17px;
}

#result {
  display: none;
  margin-top: 14px;
  padding: 18px;
  border-radius: 14px;
  background: #00360c;
  text-align: center;
  font-size: 18px;
}

#barcodeText {
  margin-top: 8px;
  font-size: 29px;
  font-weight: bold;
  word-break: break-all;
}

button {
  width: 100%;
  min-height: 58px;
  border: 0;
  border-radius: 14px;
  margin-top: 14px;
  font-size: 18px;
  font-weight: bold;
}

#startBtn {
  display: none;
  background: #fff;
  color: #111;
}

#backBtn {
  background: #292929;
  color: #fff;
}

</style>
</head>

<body>

<div class="page">

  <h1>สแกนบาร์โค้ดสินค้า</h1>

  <div class="subtitle">
    หันกล้องไปที่ Barcode<br>
    ระบบจะอ่านให้อัตโนมัติ
  </div>

  <div class="camera-box">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div class="scan-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line"></div>
    </div>

  </div>

  <div id="status">
    ⏳ กำลังเปิดกล้อง...
  </div>

  <div id="result">

    ✅ อ่าน Barcode สำเร็จ

    <div id="barcodeText"></div>

    <div style="margin-top:8px;font-size:15px;">
      กำลังกลับไปหน้าบันทึกสินค้า...
    </div>

  </div>

  <button
    id="startBtn"
    onclick="startCamera()">
    📷 เปิดกล้อง
  </button>

  <button
    id="backBtn"
    onclick="goBack()">
    ← กลับ
  </button>

</div>


<script>

/* ========================================
   URL Apps Script สำรอง
======================================== */

const DEFAULT_APP_URL =
  "https://script.google.com/macros/s/AKfycbzpsYUERAIgBZX3oANef_MerA3lS222I9AxAYKU9Nx67JqcRw_dVfEp83ZudryZW-6R/exec";


/* ========================================
   รับ return URL และ token
   ที่ Apps Script ส่งมาให้ Scanner
======================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const RECEIVED_RETURN_URL =
  params.get("return") || "";


const SCAN_TOKEN =
  params.get("token") || "";


/*
  ถ้ามี return จาก Apps Script
  ใช้ URL นั้น

  ถ้าไม่มี
  ใช้ URL สำรอง
*/

const APP_URL =
  RECEIVED_RETURN_URL ||
  DEFAULT_APP_URL;


/* ========================================
   Elements
======================================== */

const video =
  document.getElementById("video");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const barcodeText =
  document.getElementById("barcodeText");

const startBtn =
  document.getElementById("startBtn");


let stream = null;

let detector = null;

let scanning = false;

let detected = false;


/* ========================================
   เปิดกล้อง
======================================== */

async function startCamera() {

  detected = false;
  scanning = false;

  resultBox.style.display = "none";
  startBtn.style.display = "none";

  statusBox.innerHTML =
    "⏳ กำลังเปิดกล้อง...";

  stopCamera();


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      "Browser นี้ไม่รองรับการเปิดกล้อง"
    );

    return;
  }


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          }

        }

      });


    video.srcObject = stream;

    await video.play();


    statusBox.innerHTML =
      "🔎 นำ Barcode ให้อยู่ในกรอบ";


    await prepareDetector();


  } catch (error) {


    try {

      stream =
        await navigator.mediaDevices.getUserMedia({

          audio: false,

          video: true

        });


      video.srcObject = stream;

      await video.play();


      statusBox.innerHTML =
        "🔎 นำ Barcode ให้อยู่ในกรอบ";


      await prepareDetector();


    } catch (error2) {

      showError(
        (error2.name || "Error") +
        ": " +
        (error2.message || error2)
      );

    }

  }

}


/* ========================================
   เตรียม Barcode Detector
======================================== */

async function prepareDetector() {

  if (!("BarcodeDetector" in window)) {

    showError(
      "Browser นี้เปิดกล้องได้ แต่ไม่รองรับ Barcode Detector"
    );

    return;
  }


  try {

    const supported =
      await BarcodeDetector.getSupportedFormats();


    const wanted = [

      "ean_13",
      "ean_8",
      "upc_a",
      "upc_e",
      "code_128",
      "code_39",
      "itf"

    ];


    const formats =
      wanted.filter(function(format) {

        return supported.includes(format);

      });


    if (formats.length > 0) {

      detector =
        new BarcodeDetector({
          formats: formats
        });

    } else {

      detector =
        new BarcodeDetector();

    }


    scanning = true;

    scanLoop();


  } catch (error) {

    detector =
      new BarcodeDetector();

    scanning = true;

    scanLoop();

  }

}


/* ========================================
   อ่าน Barcode ต่อเนื่อง
======================================== */

async function scanLoop() {

  if (
    !scanning ||
    detected
  ) {

    return;
  }


  try {

    if (
      detector &&
      video.readyState >= 2
    ) {

      const barcodes =
        await detector.detect(video);


      if (
        barcodes &&
        barcodes.length > 0
      ) {

        const value =
          String(
            barcodes[0].rawValue || ""
          ).trim();


        if (value) {

          barcodeFound(value);

          return;
        }

      }

    }

  } catch (error) {

    /*
      ถ้า Detect พลาดชั่วคราว
      ให้สแกนต่อ
    */

  }


  setTimeout(
    scanLoop,
    100
  );

}


/* ========================================
   เมื่อพบ Barcode
======================================== */

function barcodeFound(value) {

  if (detected) {
    return;
  }


  detected = true;
  scanning = false;


  barcodeText.textContent =
    value;


  resultBox.style.display =
    "block";


  statusBox.innerHTML =
    "✅ สแกนสำเร็จ";


  if (navigator.vibrate) {

    navigator.vibrate(
      [100, 50, 100]
    );

  }


  stopCamera();


  /*
    ========================================
    จุดสำคัญ

    ส่งกลับ Apps Script พร้อมทั้ง

    1. barcode
    2. token

    Token ต้องเป็นตัวเดิม
    ที่ Apps Script ส่งมาให้ Scanner
    ========================================
  */


  let separator = "?";


  /*
    กันกรณี APP_URL มี ? อยู่แล้ว
  */

  if (APP_URL.includes("?")) {

    separator = "&";

  }


  let returnUrl =

    APP_URL +

    separator +

    "barcode=" +

    encodeURIComponent(value);


  /*
    ถ้ามี Token
    ต้องส่ง Token กลับไปด้วย
  */

  if (SCAN_TOKEN) {

    returnUrl +=

      "&token=" +

      encodeURIComponent(
        SCAN_TOKEN
      );

  }


  /*
    แสดงผลสั้น ๆ
    แล้วกลับ Apps Script
  */

  setTimeout(
    function() {

      window.location.replace(
        returnUrl
      );

    },
    700
  );

}


/* ========================================
   ปิดกล้อง
======================================== */

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

  }


  stream = null;

  video.srcObject = null;

}


/* ========================================
   Error
======================================== */

function showError(message) {

  scanning = false;


  statusBox.innerHTML =
    "❌ " +
    escapeHtml(message);


  startBtn.style.display =
    "block";

}


/* ========================================
   ปุ่มกลับ
======================================== */

function goBack() {

  stopCamera();


  /*
    ถ้ายังไม่ได้สแกน
    กลับระบบหลัก

    แต่ส่ง Token กลับไปด้วย
    เพื่อไม่ให้ข้อมูลเดิมหาย
  */

  let separator =
    APP_URL.includes("?")
      ? "&"
      : "?";


  let returnUrl =
    APP_URL;


  if (SCAN_TOKEN) {

    returnUrl +=

      separator +

      "token=" +

      encodeURIComponent(
        SCAN_TOKEN
      );

  }


  window.location.href =
    returnUrl;

}


/* ========================================
   Escape HTML
======================================== */

function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ========================================
   เปิดกล้องอัตโนมัติ
======================================== */

window.addEventListener(
  "load",
  function() {

    /*
      เช็กก่อนว่า Scanner ได้ Token มาหรือไม่

      ถึงไม่มี Token กล้องก็ยังเปิดได้
      แต่การกลับไปคืน State จะทำไม่ได้
  */

    startCamera();

  }
);


/* ========================================
   ปิดกล้องเมื่อออกจากหน้า
======================================== */

window.addEventListener(
  "pagehide",
  function() {

    stopCamera();

  }
);

</script>

</body>
</html>
