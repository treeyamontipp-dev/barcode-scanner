<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
  maximum-scale=1.0, user-scalable=no">

<title>สแกนบาร์โค้ดสินค้า</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, "Noto Sans Thai", sans-serif;
}

body {
  min-height: 100vh;
  padding: 18px 16px 30px;
}

.page {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

h1 {
  margin: 8px 0 5px;
  text-align: center;
  font-size: 27px;
}

.subtitle {
  text-align: center;
  color: #ddd;
  font-size: 16px;
  margin-bottom: 16px;
  line-height: 1.5;
}

.camera-box {
  position: relative;
  width: 100%;
  height: 58vh;
  min-height: 390px;
  max-height: 620px;
  overflow: hidden;
  border-radius: 22px;
  background: #111;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #111;
}

.scan-frame {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 50%;
  height: 180px;
  transform: translateY(-50%);
  pointer-events: none;
}

.corner {
  position: absolute;
  width: 45px;
  height: 45px;
  border-color: #fff;
  border-style: solid;
}

.tl {
  left: 0;
  top: 0;
  border-width: 6px 0 0 6px;
}

.tr {
  right: 0;
  top: 0;
  border-width: 6px 6px 0 0;
}

.bl {
  left: 0;
  bottom: 0;
  border-width: 0 0 6px 6px;
}

.br {
  right: 0;
  bottom: 0;
  border-width: 0 6px 6px 0;
}

.scan-line {
  position: absolute;
  left: 5%;
  right: 5%;
  top: 50%;
  height: 3px;
  background: #fff;
  opacity: .75;
}

#status {
  margin-top: 14px;
  padding: 16px;
  border-radius: 14px;
  background: #151515;
  text-align: center;
  font-size: 17px;
}

#result {
  display: none;
  margin-top: 14px;
  padding: 18px;
  border-radius: 14px;
  background: #00360c;
  text-align: center;
  font-size: 18px;
}

#barcodeText {
  margin-top: 7px;
  font-size: 28px;
  font-weight: bold;
  word-break: break-all;
}

button {
  width: 100%;
  min-height: 58px;
  border: 0;
  border-radius: 14px;
  margin-top: 14px;
  font-size: 18px;
  font-weight: bold;
}

#startBtn {
  display: none;
  background: #fff;
  color: #111;
}

#switchBtn {
  display: none;
  background: #444;
  color: #fff;
}

#backBtn {
  background: #292929;
  color: #fff;
}

</style>

</head>

<body>

<div class="page">

  <h1>สแกนบาร์โค้ดสินค้า</h1>

  <div class="subtitle">
    หันกล้องไปที่ Barcode<br>
    ระบบจะอ่านให้อัตโนมัติ
  </div>


  <div class="camera-box">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>

    <div class="scan-frame">

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="scan-line"></div>

    </div>

  </div>


  <div id="status">
    ⏳ กำลังเปิดกล้อง...
  </div>


  <div id="result">

    ✅ อ่าน Barcode สำเร็จ

    <div id="barcodeText"></div>

    <div style="margin-top:8px;font-size:15px;">
      กำลังกลับไปหน้าบันทึกสินค้า...
    </div>

  </div>


  <button
    id="startBtn"
    onclick="startCamera()">

    📷 เปิดกล้อง

  </button>


  <button
    id="switchBtn"
    onclick="switchCamera()">

    🔄 สลับกล้อง

  </button>


  <button
    id="backBtn"
    onclick="goBack()">

    ← กลับ

  </button>

</div>


<script>

const video =
  document.getElementById("video");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const barcodeText =
  document.getElementById("barcodeText");

const startBtn =
  document.getElementById("startBtn");

const switchBtn =
  document.getElementById("switchBtn");


let stream = null;

let detector = null;

let scanning = false;

let detected = false;

let cameras = [];

let cameraIndex = 0;


/* ==========================================
   เปิดกล้อง
========================================== */

async function startCamera() {

  detected = false;
  scanning = false;

  resultBox.style.display = "none";
  startBtn.style.display = "none";

  statusBox.innerHTML =
    "⏳ กำลังเปิดกล้อง...";

  stopCamera();


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      "Browser นี้ไม่รองรับการเปิดกล้อง"
    );

    return;

  }


  try {

    /*
      เปิดกล้องหลังโดยตรง
      ใช้ ideal ไม่ใช้ exact
      จึงไม่เกิด NotFoundError แบบเดิม
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        }

      });


    video.srcObject = stream;

    await video.play();


    statusBox.innerHTML =
      "🔎 นำ Barcode ให้อยู่ในกรอบ";


    /*
      โหลดรายชื่อกล้องไว้
      แต่ไม่ปิด/เปิดกล้องใหม่
    */

    loadCameraList();


    await prepareDetector();


  } catch (error) {

    console.error(error);


    /*
      ถ้ากล้องหลังแบบ ideal ไม่สำเร็จ
      ลอง video ธรรมดาอีกครั้ง
    */

    try {

      stream =
        await navigator.mediaDevices.getUserMedia({

          audio: false,

          video: true

        });


      video.srcObject = stream;

      await video.play();


      statusBox.innerHTML =
        "🔎 นำ Barcode ให้อยู่ในกรอบ";


      loadCameraList();

      await prepareDetector();


    } catch (error2) {

      console.error(error2);

      showError(
        (error2.name || "Error") +
        ": " +
        (error2.message || error2)
      );

    }

  }

}


/* ==========================================
   โหลดรายชื่อกล้อง
========================================== */

async function loadCameraList() {

  try {

    const devices =
      await navigator.mediaDevices.enumerateDevices();


    cameras =
      devices.filter(function(device) {

        return device.kind === "videoinput";

      });


    if (cameras.length > 1) {

      switchBtn.style.display =
        "block";

    }


    /*
      หาว่ากล้องที่กำลังใช้คือกล้องไหน
    */

    if (
      stream &&
      stream.getVideoTracks().length
    ) {

      const settings =
        stream
          .getVideoTracks()[0]
          .getSettings();


      const currentId =
        settings.deviceId;


      const found =
        cameras.findIndex(
          function(camera) {

            return camera.deviceId === currentId;

          }
        );


      if (found >= 0) {

        cameraIndex = found;

      }

    }


  } catch (error) {

    console.log(error);

  }

}


/* ==========================================
   สลับกล้อง
========================================== */

async function switchCamera() {

  if (cameras.length < 2) {
    return;
  }


  cameraIndex++;

  if (cameraIndex >= cameras.length) {

    cameraIndex = 0;

  }


  const camera =
    cameras[cameraIndex];


  if (!camera) {
    return;
  }


  stopCamera();


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          deviceId: {
            exact: camera.deviceId
          }

        }

      });


    video.srcObject = stream;

    await video.play();


    detected = false;

    scanning = true;


    statusBox.innerHTML =
      "🔎 นำ Barcode ให้อยู่ในกรอบ";


    scanLoop();


  } catch (error) {

    console.error(error);

    showError(
      "สลับกล้องไม่สำเร็จ"
    );

  }

}


/* ==========================================
   เตรียม Barcode Detector
========================================== */

async function prepareDetector() {

  if (!("BarcodeDetector" in window)) {

    showError(
      "Browser นี้เปิดกล้องได้ แต่ไม่รองรับ Barcode Detector"
    );

    return;

  }


  try {

    const supported =
      await BarcodeDetector.getSupportedFormats();


    const wanted = [

      "ean_13",
      "ean_8",
      "upc_a",
      "upc_e",
      "code_128",
      "code_39",
      "itf"

    ];


    const formats =
      wanted.filter(function(format) {

        return supported.includes(format);

      });


    if (formats.length) {

      detector =
        new BarcodeDetector({
          formats: formats
        });

    } else {

      detector =
        new BarcodeDetector();

    }


    scanning = true;

    scanLoop();


  } catch (error) {

    console.error(error);


    detector =
      new BarcodeDetector();


    scanning = true;

    scanLoop();

  }

}


/* ==========================================
   Scan Loop
========================================== */

async function scanLoop() {

  if (
    !scanning ||
    detected
  ) {

    return;

  }


  try {

    if (
      detector &&
      video.readyState >= 2
    ) {

      const barcodes =
        await detector.detect(video);


      if (
        barcodes &&
        barcodes.length > 0
      ) {

        const value =
          String(
            barcodes[0].rawValue || ""
          ).trim();


        if (value) {

          barcodeFound(value);

          return;

        }

      }

    }

  } catch (error) {

    /*
      detect อาจ error ชั่วคราว
      ไม่ต้องหยุด Scanner
    */

  }


  setTimeout(
    scanLoop,
    100
  );

}


/* ==========================================
   พบ Barcode
========================================== */

function barcodeFound(value) {

  if (detected) {
    return;
  }


  detected = true;
  scanning = false;


  barcodeText.textContent =
    value;


  resultBox.style.display =
    "block";


  statusBox.innerHTML =
    "✅ สแกนสำเร็จ";


  if (navigator.vibrate) {

    navigator.vibrate(
      [100, 50, 100]
    );

  }


  /*
    ปิดกล้องทันที
  */

  stopCamera();


  /*
    สำคัญที่สุด:
    ส่ง Barcode กลับไปยังหน้า Apps Script
  */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    try {

      window.opener.postMessage(

        {
          type: "BARCODE_SCAN",
          barcode: value
        },

        "*"

      );


      /*
        รอให้หน้าเดิมรับข้อมูล
        แล้วปิดหน้า Scanner
      */

      setTimeout(
        function() {

          window.close();

        },
        500
      );


      return;

    } catch (error) {

      console.error(error);

    }

  }


  /*
    ถ้า Browser ไม่ยอมให้ window.opener
    จะไม่ทำ Barcode หาย

    แสดงผลไว้ และให้ผู้ใช้กดกลับได้
  */

  statusBox.innerHTML =
    "✅ สแกนสำเร็จ — กดกลับไปหน้าระบบ";

}


/* ==========================================
   ปิดกล้อง
========================================== */

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

  }


  stream = null;

  video.srcObject = null;

}


/* ==========================================
   Error
========================================== */

function showError(message) {

  scanning = false;

  statusBox.innerHTML =
    "❌ " + escapeHtml(message);


  startBtn.style.display =
    "block";

}


/* ==========================================
   กลับ
========================================== */

function goBack() {

  stopCamera();


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.close();

    return;

  }


  history.back();

}


/* ==========================================
   Escape
========================================== */

function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ==========================================
   เปิดกล้องทันทีเมื่อเข้าหน้า Scanner
========================================== */

window.addEventListener(
  "load",
  function() {

    startCamera();

  }
);


window.addEventListener(
  "pagehide",
  function() {

    stopCamera();

  }
);

</script>

</body>
</html>
