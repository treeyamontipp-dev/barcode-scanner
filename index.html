<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no">

  <title>สแกนบาร์โค้ดสินค้า</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom);
    }

    .scanner-page {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 24px 18px 30px;
    }

    h1 {
      margin: 10px 0 8px;
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #ddd;
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      min-height: 420px;
      overflow: hidden;
      border-radius: 22px;
      background: #111;
    }

    #reader video {
      width: 100% !important;
      object-fit: cover;
    }

    #status {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      background: #171717;
      text-align: center;
      line-height: 1.5;
      font-size: 17px;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 20px;
      border-radius: 14px;
      background: #12351e;
      text-align: center;
    }

    #barcode {
      margin-top: 8px;
      font-size: 28px;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      width: 100%;
      min-height: 60px;
      margin-top: 15px;
      border: 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #fff;
      color: #111;
    }

    #backBtn {
      background: #292929;
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="scanner-page">

    <h1>สแกนบาร์โค้ดสินค้า</h1>

    <div class="subtitle">
      หันกล้องไปที่บาร์โค้ด<br>
      ระบบจะสแกนให้อัตโนมัติ
    </div>

    <div id="reader"></div>

    <div id="status">
      กำลังเปิดกล้อง...
    </div>

    <div id="result">
      ✅ สแกนสำเร็จ
      <div id="barcode"></div>
    </div>

    <button
      id="startBtn"
      onclick="startScanner()"
      style="display:none;">
      📷 เปิดกล้องอีกครั้ง
    </button>

    <button
      id="backBtn"
      onclick="goBackWithoutBarcode()">
      ← กลับ
    </button>

  </div>


<script>

let scanner = null;
let scannerRunning = false;
let scanLocked = false;


/* ===========================
   เริ่ม Scanner
=========================== */

async function startScanner() {

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const startBtn =
    document.getElementById("startBtn");

  scanLocked = false;

  result.style.display = "none";
  startBtn.style.display = "none";

  status.innerHTML =
    "⏳ กำลังเปิดกล้อง...";


  try {

    if (scanner) {

      try {
        await scanner.clear();
      } catch (e) {}

    }


    scanner =
      new Html5Qrcode(
        "reader",
        {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.ITF
          ]
        }
      );


    const config = {

      fps: 15,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const width =
          Math.floor(
            viewfinderWidth * 0.82
          );

        const height =
          Math.floor(
            Math.min(
              width * 0.42,
              180
            )
          );

        return {
          width: width,
          height: height
        };
      }

    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      function() {
        // ยังอ่านไม่เจอ ให้สแกนต่อ
      }

    );


    scannerRunning = true;

    status.innerHTML =
      "🔎 นำ Barcode ให้อยู่ในกรอบ";


  } catch (error) {

    console.error(error);

    scannerRunning = false;

    status.innerHTML =
      "❌ เปิดกล้องไม่สำเร็จ<br><br>" +
      escapeHtml(
        error.name ||
        error.message ||
        String(error)
      );

    startBtn.style.display =
      "block";

  }

}


/* ===========================
   อ่าน Barcode สำเร็จ
=========================== */

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (scanLocked) {
    return;
  }


  const barcode =
    String(decodedText || "").trim();


  if (!barcode) {
    return;
  }


  scanLocked = true;


  document
    .getElementById("barcode")
    .innerText = barcode;


  document
    .getElementById("result")
    .style.display = "block";


  document
    .getElementById("status")
    .innerHTML =
      "✅ อ่าน Barcode สำเร็จ";


  if (navigator.vibrate) {
    navigator.vibrate([100, 50, 100]);
  }


  await stopScanner();


  /*
    รอสั้น ๆ ให้ผู้ใช้เห็นว่าอ่านสำเร็จ
    แล้วส่ง Barcode กลับ Apps Script
  */

  setTimeout(
    function() {

      returnBarcode(barcode);

    },
    500
  );

}


/* ===========================
   ปิด Scanner
=========================== */

async function stopScanner() {

  try {

    if (
      scanner &&
      scannerRunning
    ) {

      await scanner.stop();

    }

  } catch (e) {

    console.log(e);

  }


  scannerRunning = false;

}


/* ===========================
   ส่ง Barcode กลับ
=========================== */

function returnBarcode(barcode) {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    params.get("return");


  /*
    ถ้ามี URL ของ Apps Script ส่งมา
  */

  if (returnUrl) {

    const separator =
      returnUrl.includes("?")
        ? "&"
        : "?";


    window.location.href =

      returnUrl +

      separator +

      "barcode=" +

      encodeURIComponent(barcode);

  }

  else {

    /*
      เปิด Scanner โดยตรง
      ก็แค่แสดงผล
    */

    document
      .getElementById("startBtn")
      .style.display = "block";

  }

}


/* ===========================
   กลับโดยไม่สแกน
=========================== */

function goBackWithoutBarcode() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    params.get("return");


  if (returnUrl) {

    window.location.href =
      returnUrl;

  }

  else {

    history.back();

  }

}


/* ===========================
   Escape HTML
=========================== */

function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* ===========================
   เปิด Scanner อัตโนมัติ
=========================== */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


/* ===========================
   ออกจากหน้า = ปิดกล้อง
=========================== */

window.addEventListener(
  "pagehide",
  function() {

    if (
      scanner &&
      scannerRunning
    ) {

      scanner.stop()
        .catch(function() {});

    }

  }
);

</script>

</body>
</html>
